<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSI AI Agents Dasboardl</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #1a56db;
      --blue-dk: #1040b0;
      --red:     #e02424;
      --bg:      #0f1117;
      --surface: #181c27;
      --border:  #252b3b;
      --text:    #f0f2f8;
      --muted:   #8892a4;
      --header-start: #111624;
      --logo-wrap-bg: rgba(255, 255, 255, 0.04);
      --logo-wrap-border: rgba(255, 255, 255, 0.08);
      --badge-live:   #16a34a;
      --badge-coming: #44505f;
    }

    [data-theme='light'] {
      --bg:      #f3f6fb;
      --surface: #ffffff;
      --border:  #d2dced;
      --text:    #13233f;
      --muted:   #4d5f7c;
      --header-start: #e8eef8;
      --logo-wrap-bg: rgba(19, 35, 63, 0.04);
      --logo-wrap-border: rgba(19, 35, 63, 0.14);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      position: relative;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--header-start) 0%, var(--bg) 100%);
    }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 0.45rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      line-height: 1;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--blue);
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--logo-wrap-bg);
      border: 1px solid var(--logo-wrap-border);
      border-radius: 14px;
      padding: 0.5rem 0.85rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    .logo-image {
      width: clamp(55px, 9.5vw, 105px);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .logo-fallback {
      display: none;
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--red) 100%);
      border-radius: 10px;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span.psi  { color: var(--blue); }
    header h1 span.dash { color: var(--muted); font-weight: 300; margin: 0 0.35rem; }
    header h1 span.sub  { color: var(--red); }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }

    /* ── Grid ─────────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 2.5rem 2rem 3rem;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    .section-label {
      text-transform: uppercase;
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.85rem;
      align-items: start;
    }
    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* ── Card ─────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 60%, rgba(26,86,219,0.06) 100%);
      pointer-events: none;
    }

    .card.live {
      cursor: pointer;
    }

    .card.live:hover {
      transform: translateY(-4px);
      border-color: var(--blue);
      box-shadow: 0 8px 32px rgba(26, 86, 219, 0.18);
    }

    .card.live:hover .card-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .card.coming {
      opacity: 0.55;
      cursor: default;
    }

    /* Card header row */
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.55rem;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .badge.live   { background: rgba(22,163,74,0.15);  color: #4ade80; border: 1px solid rgba(22,163,74,0.35); }
    .badge.coming { background: rgba(68,80,95,0.25);    color: var(--muted); border: 1px solid var(--border); }

    [data-theme='light'] .badge.live {
      color: #166534;
      background: rgba(22, 163, 74, 0.14);
      border: 1px solid rgba(22, 163, 74, 0.3);
    }

    /* Card body */
    .card-body { flex: 1; }

    .card-body h2 {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 0.35rem;
    }

    .card-body p {
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Arrow */
    .card-arrow {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      color: var(--blue);
      font-weight: 500;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .card-arrow svg { flex-shrink: 0; }

    /* ── Footer ───────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Icon color helpers ───────────────────────────────── */
    .icon-blue   { background: rgba(26,86,219,0.15); }
    .icon-red    { background: rgba(224,36,36,0.15); }
    .icon-green  { background: rgba(22,163,74,0.15); }
    .icon-violet { background: rgba(124,58,237,0.15); }

    @media (max-width: 480px) {
      header { padding: 2rem 1.25rem 1.5rem; }
      main   { padding: 2rem 1.25rem 2.5rem; }
      .grid  { grid-template-columns: 1fr; }
    }
    /* ── Collapsible Container ── */
    .collapsible-container {
      transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out, margin-bottom 0.4s ease-in-out;
      overflow: hidden;
      max-height: 1000px;
      opacity: 1;
      margin-bottom: 1.5rem;
    }
    .collapsible-container.collapsed {
      max-height: 0;
      opacity: 0;
      margin-bottom: 0 !important;
      pointer-events: none;
    }

    /* ── Chat Widget ── */
    .chat-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .chat-header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--blue);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .api-key-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .api-key-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      width: 240px;
      transition: border-color 0.2s ease;
    }
    .api-key-input:focus {
      border-color: var(--blue);
    }

    .chat-body {
      height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 0.5rem;
    }

    .chat-input-area {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chat-textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.85rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      resize: vertical;
      min-height: 120px;
      transition: border-color 0.2s ease;
      line-height: 1.4;
    }
    .chat-textarea:focus {
      border-color: var(--blue);
    }

    .chat-btn-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem;
    }

    .btn-primary {
      background: var(--blue);
      border: none;
      color: #ffffff;
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .btn-primary:hover {
      background: var(--blue-dk);
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-secondary:hover {
      background: var(--logo-wrap-bg);
      border-color: var(--blue);
    }

    /* ── Table styling inside Chat ── */
    .chat-table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 1rem;
      background: var(--bg);
    }

    .chat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    .chat-table th {
      background: rgba(0, 0, 0, 0.1);
      padding: 0.85rem 1.1rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .chat-table td {
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      line-height: 1.4;
    }

    .chat-table tr:last-child td {
      border-bottom: none;
    }

    .chat-table a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }
    .chat-table a:hover {
      text-decoration: underline;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 3rem;
      color: var(--muted);
      text-align: center;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark mode">Light Mode</button>
    <div class="logo-row">
      <div class="logo-wrap">
        <img id="psi-logo" class="logo-image" src="assets/psi-logo.png" alt="Project Services International logo" />
        <div id="psi-logo-fallback" class="logo-fallback">🏢</div>
      </div>
    </div>
    <h1><span class="psi">Project Services International</span></h1>
    <p>Proposal Preparation Workflow &nbsp;·&nbsp; Select an application to launch</p>
  </header>

  <main>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
      <p class="section-label" style="margin-bottom: 0;">Proposal Preparation AI Agents</p>
      <button id="toggle-cards-btn" class="btn-secondary" type="button" style="font-size: 0.8rem; padding: 0.4rem 0.85rem;">🖥️ Minimize Agent Cards</button>
    </div>
    
    <!-- Collapsible Wrapper for the 4 Agent Cards -->
    <div id="cards-collapsible" class="collapsible-container">
      <div class="grid" id="app-grid"></div>
    </div>

    <!-- Google AI Search Chat Panel (Moved below the 4 Cards) -->
    <div class="chat-container" id="chat-widget">
      <div class="chat-header">
        <div class="chat-header-title">
          <span>🤖</span> PSI AI Assistant
        </div>
        <div class="api-key-container">
          <label for="portal-api-key" style="font-weight: 600; color: var(--muted);">Gemini API Key:</label>
          <input type="password" id="portal-api-key" class="api-key-input" placeholder="Enter API Key to enable search..." />
        </div>
      </div>

      <div class="chat-body" id="results-container">
        <div style="padding: 2.5rem; text-align: center; color: var(--muted); font-size: 0.95rem;">
          Ask a general procurement or technical question to get started...
        </div>
      </div>

      <!-- Prompt Templates & Export Button -->
      <div style="display: flex; gap: 0.5rem; align-items: center; width: 100%; margin-bottom: 0.5rem; flex-wrap: wrap; padding: 0.25rem 0;">
        <select id="prompt-template-select" style="flex: 1; min-width: 180px; padding: 0.35rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.85rem; cursor: pointer;">
          <option value="">📋 Select a Quick-Action Prompt Template...</option>
          <option value="analyze">📝 Analyze Compliance (Identify hidden deliverables / requirements)</option>
          <option value="compare">⚖️ Compare RFQ to Proposal (Highlight gaps and compliance flags)</option>
          <option value="draft">✍️ Draft Technical Response (Write compliant response text)</option>
          <option value="summary">🔍 Summarize Scope of Work (Summarize key objectives and deadlines)</option>
        </select>
        <button id="export-chat-btn" class="btn-secondary" type="button" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;" title="Export conversation log to markdown file">📤 Export Chat</button>
      </div>

      <!-- Attachment Pill List -->
      <div id="attachments-container" style="display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem;"></div>

      <div class="chat-input-area">
        <textarea id="text-input" class="chat-textarea" placeholder="Ask a general procurement or technical question..."></textarea>
        <div class="chat-btn-row" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 0.5rem;">
          <div style="display: flex; gap: 0.4rem; align-items: center;">
            <button id="clear-chat-btn" class="btn-secondary" type="button" style="font-size: 0.8rem; padding: 0.45rem 0.9rem; border-color: var(--border);">🗑️ Clear Chat</button>
            <button id="attach-btn" class="btn-secondary" type="button" style="font-size: 0.8rem; padding: 0.45rem 0.9rem; border-color: var(--border);" title="Attach PDF, Word, CSV or Text files">📎 Attach File</button>
            <input type="file" id="chat-file-input" multiple style="display: none;" accept=".pdf,.docx,.txt,.csv" />
          </div>
          <button id="search-btn" class="btn-primary" type="button">💬 Ask Assistant</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    Project Services International &nbsp;·&nbsp; Agents Workflow 
  </footer>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const storedTheme = localStorage.getItem('theme');
    const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    const activeTheme = storedTheme || preferredTheme;

    const applyTheme = theme => {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      if (themeToggle) {
        themeToggle.textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
        themeToggle.setAttribute('aria-label', `Switch to ${theme === 'dark' ? 'light' : 'dark'} mode`);
      }
    };

    applyTheme(activeTheme);

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });
    }

    const logo = document.getElementById('psi-logo');
    const logoFallback = document.getElementById('psi-logo-fallback');
    if (logo) {
      logo.addEventListener('error', () => {
        logo.style.display = 'none';
        if (logoFallback) {
          logoFallback.style.display = 'inline-flex';
        }
      });
    }

    const apps = [
      {
        id: 'sam',
        icon: '🔍',
        iconClass: 'icon-blue',
        title: 'SAM Opportunities Searcher',
        desc: 'Search and discover active government contracting opportunities on SAM.gov filtered for PSI\u2019s capabilities.',
        url: 'https://psiagent.onrender.com/',
        live: true,
      },
      {
        id: 'rfq',
        icon: '📋',
        iconClass: 'icon-red',
        title: 'RFQ Analyst',
        desc: 'Upload an RFQ/RFP document to extract the executive summary, BOM, compliance requirements, and proposal checklist.',
        url: 'https://psi-workflow.onrender.com/',
        live: true,
      },
      {
        id: 'sourcing',
        icon: '💎',
        iconClass: 'icon-blue',
        title: 'BOM Price Searcher',
        desc: 'Upload compliance reports, retrieve matching vendor prices using AI Google Grounding, and export hyperlinked sheets.',
        url: 'https://psi-workflow-prices.onrender.com/',
        live: true,
      },
      {
        id: 'inspector',
        icon: '🔎',
        iconClass: 'icon-violet',
        title: 'Technical Proposal Inspector',
        desc: 'Reviews a completed technical proposal against solicitation requirements and flags compliance gaps.',
        url: 'https://psi-workflow-1.onrender.com/',
        live: true,
      },
    ];

    const grid = document.getElementById('app-grid');

    apps.forEach(app => {
      const card = document.createElement('div');
      card.className = `card ${app.live ? 'live' : 'coming'}`;
      card.setAttribute('role', app.live ? 'button' : 'article');
      if (app.live) {
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `Open ${app.title}`);
      }

      card.innerHTML = `
        <div class="card-top">
          <div class="card-icon ${app.iconClass}">${app.icon}</div>
          <span class="badge ${app.live ? 'live' : 'coming'}">${app.live ? '● Live' : 'Coming Soon'}</span>
        </div>
        <div class="card-body">
          <h2>${app.title}</h2>
          <p>${app.desc}</p>
        </div>
        ${app.live ? `
        <div class="card-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          Open app
        </div>` : ''}
      `;

      if (app.live) {
        const open = () => window.open(app.url, '_blank', 'noopener,noreferrer');
        card.addEventListener('click', open);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
      }

      grid.appendChild(card);
    });

    // ── Collapsible Agent Cards Grid ───────────────────────────
    const toggleCardsBtn = document.getElementById('toggle-cards-btn');
    const cardsCollapsible = document.getElementById('cards-collapsible');
    if (toggleCardsBtn && cardsCollapsible) {
      toggleCardsBtn.addEventListener('click', () => {
        const isCollapsed = cardsCollapsible.classList.toggle('collapsed');
        toggleCardsBtn.innerHTML = isCollapsed 
          ? '🖥️ Maximize Agent Cards' 
          : '🖥️ Minimize Agent Cards';
      });
    }

    // ── Google AI Search Widget logic ──────────────────────────
    const searchBtn = document.getElementById('search-btn');
    const clearChatBtn = document.getElementById('clear-chat-btn');
    const attachBtn = document.getElementById('attach-btn');
    const chatFileInput = document.getElementById('chat-file-input');
    const attachmentsContainer = document.getElementById('attachments-container');
    const promptTemplateSelect = document.getElementById('prompt-template-select');
    const exportChatBtn = document.getElementById('export-chat-btn');
    const textInput = document.getElementById('text-input');
    const portalApiKey = document.getElementById('portal-api-key');
    const resultsContainer = document.getElementById('results-container');

    // Conversation history state & attached files state
    let chatHistory = [];
    let attachedFiles = [];

    // Load stored key
    if (portalApiKey) {
      portalApiKey.value = localStorage.getItem('gemini_api_key') || '';
    }

    // Render attachments pill bar
    function renderAttachments() {
      if (!attachmentsContainer) return;
      attachmentsContainer.innerHTML = '';
      attachedFiles.forEach((file, idx) => {
        const pill = document.createElement('div');
        pill.style.cssText = 'background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 6px; padding: 0.25rem 0.5rem; display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--text); font-weight: 500;';
        pill.innerHTML = `
          <span>📄 ${file.name} (${Math.round(file.size / 1024)} KB)</span>
          <span style="cursor: pointer; font-weight: bold; color: var(--red); font-size: 0.85rem;" onclick="removeAttachment(${idx})">✕</span>
        `;
        attachmentsContainer.appendChild(pill);
      });
    }

    // Remove attachment (must be global window context)
    window.removeAttachment = function(idx) {
      attachedFiles.splice(idx, 1);
      renderAttachments();
    };

    // File selection handler
    if (attachBtn && chatFileInput) {
      attachBtn.addEventListener('click', () => {
        chatFileInput.click();
      });

      chatFileInput.addEventListener('change', () => {
        const files = chatFileInput.files;
        if (files.length === 0) return;

        Array.from(files).forEach(file => {
          // Limit upload size (e.g. 50MB safety limit per file)
          if (file.size > 50 * 1024 * 1024) {
            alert(`File "${file.name}" is too large. Max size is 50MB.`);
            return;
          }

          // Create FormData and upload
          const formData = new FormData();
          formData.append('file', file);

          // Add a temporary "Uploading..." loading pill
          const loadingPill = document.createElement('div');
          loadingPill.id = `pill-loading-${file.name.replace(/\s+/g, '-')}`;
          loadingPill.style.cssText = 'background: var(--border); border: 1px dashed var(--muted); border-radius: 6px; padding: 0.25rem 0.5rem; display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--text-muted); font-style: italic;';
          loadingPill.innerHTML = `<span>⏳ Uploading ${file.name}...</span>`;
          attachmentsContainer.appendChild(loadingPill);

          fetch('https://psi-workflow-prices.onrender.com/api/portal-upload', {
            method: 'POST',
            body: formData
          })
          .then(res => {
            if (!res.ok) {
              return res.json().then(e => { throw new Error(e.error || 'Upload error'); });
            }
            return res.json();
          })
          .then(data => {
            // Remove loading pill
            const loading = document.getElementById(loadingPill.id);
            if (loading) loading.remove();

            if (data.success) {
              attachedFiles.push({
                name: data.filename,
                text: data.text,
                size: data.size_bytes
              });
              renderAttachments();
            }
          })
          .catch(err => {
            const loading = document.getElementById(loadingPill.id);
            if (loading) loading.remove();
            alert(`Failed to upload ${file.name}: ${err.message}`);
          });
        });

        // Reset file input element so same file can be re-uploaded
        chatFileInput.value = '';
      });
    }

    // Prompt Template Select handler
    if (promptTemplateSelect && textInput) {
      promptTemplateSelect.addEventListener('change', () => {
        const val = promptTemplateSelect.value;
        if (!val) return;

        let selectedPromptText = '';
        if (val === 'analyze') {
          selectedPromptText = 'Review the attached RFQ document. List all compliance requirements, deliverables, and hidden deadlines in a clean summary table.';
        } else if (val === 'compare') {
          selectedPromptText = 'Compare the attached RFQ document with the attached proposal document. Highlight any gaps, discrepancies, or potential compliance flags.';
        } else if (val === 'draft') {
          selectedPromptText = 'Based on the requirements in the attached RFQ document, draft a professional, compliant technical proposal response section for [Insert Section name, e.g. Section 3.2].';
        } else if (val === 'summary') {
          selectedPromptText = 'Provide a clear summary of the Scope of Work (SOW) outlined in the attached document, highlighting main objectives, key milestones, and critical constraints.';
        }

        textInput.value = selectedPromptText;
        textInput.focus();

        // Reset dropdown choice back to default
        promptTemplateSelect.value = '';
      });
    }

    // Export Chat History to PDF format using native printing
    if (exportChatBtn) {
      exportChatBtn.addEventListener('click', () => {
        if (chatHistory.length === 0) {
          alert('Chat history is empty. Ask a few questions first to export.');
          return;
        }

        const printWindow = window.open('', '_blank');
        if (!printWindow) {
          alert('Popup blocked. Please allow popups for this page to print chat logs.');
          return;
        }

        let content = `
          <html>
          <head>
            <title>PSI AI Assistant - Conversation Log</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                padding: 2.5rem;
                color: #1f2937;
                line-height: 1.6;
              }
              h1 {
                font-size: 1.6rem;
                border-bottom: 2px solid #e5e7eb;
                padding-bottom: 0.5rem;
                color: #1a56db;
                margin-top: 0;
              }
              .meta {
                font-size: 0.8rem;
                color: #6b7280;
                margin-bottom: 2.5rem;
              }
              .message {
                margin-bottom: 1.8rem;
                padding-bottom: 1rem;
                border-bottom: 1px solid #f3f4f6;
                page-break-inside: avoid;
              }
              .role {
                font-weight: 700;
                font-size: 0.95rem;
                margin-bottom: 0.35rem;
              }
              .role-user { color: #1a56db; }
              .role-assistant { color: #16a34a; }
              code {
                font-family: monospace;
                background: #f3f4f6;
                padding: 0.15rem 0.3rem;
                border-radius: 4px;
              }
              a {
                color: #1a56db;
                text-decoration: underline;
              }
            </style>
          </head>
          <body>
            <h1>PSI AI Assistant - Conversation Log</h1>
            <div class="meta">Exported on: ${new Date().toLocaleString()}</div>
        `;

        function convertMarkdownToHtmlForPrint(text) {
          let html = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

          html = html
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1 ↗</a>');

          const lines = html.split('\n');
          let output = [];
          let inTable = false;
          let tableRows = [];

          lines.forEach(line => {
            const trimmed = line.trim();
            if (trimmed.startsWith('|')) {
              inTable = true;
              const cells = line.split('|').map(c => c.trim()).filter((c, i, a) => i > 0 && i < a.length - 1);
              
              if (cells.every(c => /^:-*-*:*$/.test(c) || c.startsWith('---') || c === '')) {
                return;
              }
              
              tableRows.push(cells);
            } else {
              if (inTable && tableRows.length > 0) {
                let tableHtml = '<table style="width: 100%; border-collapse: collapse; margin: 1rem 0;">';
                tableHtml += '<thead><tr>' + tableRows[0].map(c => `<th style="border: 1px solid #e5e7eb; padding: 0.6rem 0.8rem; background: #f9fafb; font-weight: 600; text-align: left; font-size: 0.85rem;">${c}</th>`).join('') + '</tr></thead>';
                tableHtml += '<tbody>';
                for (let i = 1; i < tableRows.length; i++) {
                  tableHtml += '<tr>' + tableRows[i].map(c => `<td style="border: 1px solid #e5e7eb; padding: 0.6rem 0.8rem; font-size: 0.85rem;">${c}</td>`).join('') + '</tr>';
                }
                tableHtml += '</tbody></table>';
                output.push(tableHtml);
                tableRows = [];
                inTable = false;
              }
              output.push(line);
            }
          });

          if (inTable && tableRows.length > 0) {
            let tableHtml = '<table style="width: 100%; border-collapse: collapse; margin: 1rem 0;">';
            tableHtml += '<thead><tr>' + tableRows[0].map(c => `<th style="border: 1px solid #e5e7eb; padding: 0.6rem 0.8rem; background: #f9fafb; font-weight: 600; text-align: left; font-size: 0.85rem;">${c}</th>`).join('') + '</tr></thead>';
            tableHtml += '<tbody>';
            for (let i = 1; i < tableRows.length; i++) {
              tableHtml += '<tr>' + tableRows[i].map(c => `<td style="border: 1px solid #e5e7eb; padding: 0.6rem 0.8rem; font-size: 0.85rem;">${c}</td>`).join('') + '</tr>';
            }
            tableHtml += '</tbody></table>';
            output.push(tableHtml);
          }

          return output.join('\n');
        }

        chatHistory.forEach(msg => {
          const isUser = msg.role === 'user';
          const sender = isUser ? '🧑 You' : '🤖 Assistant';
          const roleClass = isUser ? 'role-user' : 'role-assistant';
          const htmlText = convertMarkdownToHtmlForPrint(msg.parts[0].text);

          content += `
            <div class="message">
              <div class="role ${roleClass}">${sender}</div>
              <div style="white-space: pre-wrap;">${htmlText}</div>
            </div>
          `;
        });

        content += `
          </body>
          </html>
        `;

        printWindow.document.write(content);
        printWindow.document.close();

        // Delay printing slightly to let document render fully
        setTimeout(() => {
          printWindow.focus();
          printWindow.print();
          printWindow.close();
        }, 300);
      });
    }

    // Render the chat conversation
    function renderChatHistory() {
      if (!resultsContainer) return;

      if (chatHistory.length === 0) {
        resultsContainer.innerHTML = `
          <div style="padding: 2.5rem; text-align: center; color: var(--muted); font-size: 0.95rem;">
            Ask a general procurement or technical question to get started...
          </div>
        `;
        return;
      }

      let html = '';
      chatHistory.forEach(msg => {
        const isUser = msg.role === 'user';
        const senderLabel = isUser ? '🧑 You' : '🤖 Assistant';
        const senderColor = isUser ? 'var(--blue)' : 'var(--badge-live)';
        const text = msg.parts[0].text;

        // Convert simple markdown elements and links to HTML for clickability
        let cleanedText = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1 ↗</a>');

        html += `
          <div style="margin-bottom: 1.25rem; border-bottom: ${isUser ? '1px dashed var(--border)' : 'none'}; padding-bottom: 0.75rem; text-align: left;">
            <div style="font-weight: 700; color: ${senderColor}; margin-bottom: 0.25rem; font-size: 0.9rem;">${senderLabel}:</div>
            <div style="line-height: 1.6; white-space: pre-wrap; font-size: 0.95rem;">${cleanedText}</div>
          </div>
        `;
      });

      resultsContainer.innerHTML = html;
      // Scroll to bottom
      resultsContainer.scrollTop = resultsContainer.scrollHeight;
    }

    if (searchBtn && textInput && portalApiKey && resultsContainer) {
      // Trigger search
      searchBtn.addEventListener('click', () => {
        const apiKey = portalApiKey.value.trim();
        const promptText = textInput.value.trim();

        if (!apiKey) {
          alert('Please enter your Gemini API Key first.');
          portalApiKey.focus();
          return;
        }
        if (!promptText) {
          alert('Please enter a question.');
          textInput.focus();
          return;
        }

        // Save key
        localStorage.setItem('gemini_api_key', apiKey);

        // 1. Add user message to local history (tidy question)
        chatHistory.push({ role: 'user', parts: [{ text: promptText }] });
        
        // Keep only last 20 messages (10 Q&A pairs)
        if (chatHistory.length > 20) {
          chatHistory = chatHistory.slice(-20);
        }

        // 2. Render immediately
        renderChatHistory();

        // 3. Clear textarea input window
        textInput.value = '';

        // 4. Append inline thinking loader
        resultsContainer.innerHTML += `
          <div id="thinking-loader" style="margin-bottom: 1.25rem; text-align: left;">
            <div style="font-weight: 700; color: var(--badge-live); margin-bottom: 0.25rem; font-size: 0.9rem;">🤖 Assistant:</div>
            <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0;">
              <div class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></div>
              <span style="font-size: 0.9rem; color: var(--muted); font-style: italic;">Thinking and searching web sources...</span>
            </div>
          </div>
        `;
        resultsContainer.scrollTop = resultsContainer.scrollHeight;

        // 5. Build apiHistory (where the last query has attached file context)
        let apiHistory = JSON.parse(JSON.stringify(chatHistory));
        if (apiHistory.length > 0 && attachedFiles.length > 0) {
          let fileContext = '';
          attachedFiles.forEach(file => {
            fileContext += `\n[Attached File: ${file.name}]\n[CONTENT START]\n${file.text}\n[CONTENT END]\n`;
          });
          apiHistory[apiHistory.length - 1].parts[0].text = `${fileContext}\nInstructions/Question: ${promptText}`;
        }

        // 6. Post payload with conversation history
        fetch('https://psi-workflow-prices.onrender.com/api/portal-chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            history: apiHistory,
            api_key: apiKey,
            model: 'gemini-2.5-flash'
          })
        })
        .then(response => {
          if (!response.ok) {
            return response.json().then(err => {
              throw new Error(err.error || `HTTP ${response.status}`);
            }).catch(() => {
              throw new Error(`HTTP ${response.status}`);
            });
          }
          return response.json();
        })
        .then(data => {
          if (!data.success) {
            throw new Error(data.error || 'Server error');
          }

          // Push model answer to local history
          chatHistory.push({ role: 'model', parts: [{ text: data.answer }] });
          
          // Re-slice to be safe
          if (chatHistory.length > 20) {
            chatHistory = chatHistory.slice(-20);
          }

          // Re-render
          renderChatHistory();
        })
        .catch(err => {
          // Remove the thinking loader
          const loader = document.getElementById('thinking-loader');
          if (loader) loader.remove();

          // Render error notification in the chat
          resultsContainer.innerHTML += `
            <div style="padding: 1rem; text-align: center; color: var(--red); font-weight: bold; border: 1px solid var(--red); border-radius: 6px; margin-top: 0.5rem;">
              Error: ${err.message}
            </div>
          `;
          resultsContainer.scrollTop = resultsContainer.scrollHeight;
          
          // Remove last user prompt from state to prevent invalid API states
          chatHistory.pop();
        });
      });

      // Allow pressing Enter to submit (Shift+Enter for new lines)
      textInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          searchBtn.click();
        }
      });
    }

    // Clear Chat History functionality
    if (clearChatBtn) {
      clearChatBtn.addEventListener('click', () => {
        chatHistory = [];
        attachedFiles = [];
        renderAttachments();
        renderChatHistory();
      });
    }
  </script>
</body>
</html>
